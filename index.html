<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Hub — Video ngắn</title>
<meta name="description" content="Kho video ngắn tự quay, lưu trữ ngay trong repo GitHub.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFC'/%3E%3Cstop offset='1' stop-color='%2333E6B3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%230A0B14'/%3E%3Cpolygon points='38,28 74,50 38,72' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B14; --bg-soft:#10111E;
    --glass:rgba(255,255,255,0.045); --glass-strong:rgba(255,255,255,0.075); --glass-border:rgba(255,255,255,0.09);
    --text:#F1F0F8; --muted:#8B8AA3;
    --accent:#7C5CFC; --accent-soft:rgba(124,92,252,0.16);
    --mint:#33E6B3; --mint-soft:rgba(51,230,179,0.14);
    --radius:16px; --shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  }
  html[data-theme="light"]{
    --bg:#EFEFF6; --bg-soft:#E5E4F1;
    --glass:rgba(20,18,40,0.045); --glass-strong:rgba(20,18,40,0.07); --glass-border:rgba(20,18,40,0.1);
    --text:#191825; --muted:#5C5A72;
    --accent:#6845E0; --accent-soft:rgba(104,69,224,0.12);
    --mint:#0FA57E; --mint-soft:rgba(15,165,126,0.12);
    --shadow:0 20px 50px -24px rgba(30,20,60,0.25);
  }
  @media (prefers-color-scheme: light){
    html:not([data-theme]){
      --bg:#EFEFF6; --bg-soft:#E5E4F1;
      --glass:rgba(20,18,40,0.045); --glass-strong:rgba(20,18,40,0.07); --glass-border:rgba(20,18,40,0.1);
      --text:#191825; --muted:#5C5A72;
      --accent:#6845E0; --accent-soft:rgba(104,69,224,0.12);
      --mint:#0FA57E; --mint-soft:rgba(15,165,126,0.12);
      --shadow:0 20px 50px -24px rgba(30,20,60,0.25);
    }
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; font-size:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1000px 500px at 85% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(800px 500px at 5% 15%, var(--mint-soft), transparent 55%),
      var(--bg);
    color:var(--text); font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .container{max-width:min(1180px, 94vw); margin:0 auto; padding:0 clamp(16px,3vw,24px);}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer; border:none;}
  ::selection{background:var(--accent); color:#fff;}

  /* ---------- Nav ---------- */
  .nav-wrap{position:sticky; top:16px; z-index:50; display:flex; justify-content:center; padding:0 16px; margin-bottom:8px;}
  .nav-wrap.scrolled nav.pill{ box-shadow:0 24px 50px -18px rgba(0,0,0,.55); border-color:rgba(124,92,252,.25); }
  nav.pill{
    width:100%; max-width:760px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 10px 10px 20px; background:var(--glass-strong); border:1px solid var(--glass-border);
    border-radius:999px; backdrop-filter:blur(18px) saturate(140%); box-shadow:var(--shadow);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700;}
  .brand .dot{width:10px;height:10px;border-radius:3px; background:linear-gradient(135deg,var(--accent),var(--mint)); box-shadow:0 0 14px var(--accent);}
  #theme-toggle{
    width:38px;height:38px;border-radius:50%; border:1px solid var(--glass-border); background:var(--glass);
    display:flex;align-items:center;justify-content:center; font-size:16px; transition:.2s;
  }
  #theme-toggle:hover{background:var(--glass-strong);}

  /* ---------- Hero ---------- */
  .hero{padding:clamp(32px,6vw,56px) 0 28px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--mint); font-weight:600;
    background:var(--mint-soft); border:1px solid rgba(51,230,179,.25); padding:6px 12px; border-radius:999px; margin-bottom:16px;
  }
  .eyebrow::before{content:"●"; font-size:8px;}
  h2.headline{font-size:clamp(1.9rem, 3.6vw, 2.7rem); line-height:1.1; margin:0 0 12px; font-weight:700; letter-spacing:-.5px;}
  h2.headline .accent{background:linear-gradient(135deg,var(--accent),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .lede{color:var(--muted); font-size:15.5px; line-height:1.6; max-width:56ch; margin:0;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; gap:10px; margin:26px 0 18px; flex-wrap:wrap;}
  .search-box{
    flex:1; min-width:220px; display:flex; align-items:center; gap:8px;
    background:var(--glass); border:1px solid var(--glass-border); border-radius:12px; padding:10px 14px;
  }
  .search-box input{border:none; background:transparent; outline:none; color:var(--text); font-size:14px; width:100%;}
  .search-box input::placeholder{color:var(--muted);}
  .result-count{font-size:12.5px; color:var(--muted); margin:0 0 16px;}

  /* ---------- Video grid (16:9 cards) ---------- */
  .video-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px; padding-bottom:60px;}
  .video-card{
    background:var(--glass); border:1px solid var(--glass-border); border-radius:var(--radius); overflow:hidden;
    cursor:pointer; transition:transform .25s ease, border-color .25s, box-shadow .25s;
    opacity:0; transform:translateY(14px); animation:cardIn .5s ease forwards;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .video-card:hover{transform:translateY(-4px); border-color:rgba(124,92,252,.45); box-shadow:0 20px 44px -18px rgba(124,92,252,.4);}
  .video-thumb{position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;}
  .video-thumb img, .video-thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .preview-video{
    position:absolute; inset:0; opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .preview-video.show{opacity:1;}
  .video-thumb-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent-soft), var(--mint-soft));
    font-size:34px; color:var(--text);
  }
  .video-duration{
    position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff;
    font-size:11px; font-weight:600; padding:2px 7px; border-radius:6px; z-index:2;
  }

  /* Overlay tiêu đề — ẩn mặc định, chỉ hiện khi hover/chạm, giữ khung nhìn gọn */
  .video-overlay{
    position:absolute; inset:0; z-index:1; display:flex; align-items:flex-end; padding:12px;
    background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.15) 55%, transparent 85%);
    opacity:0; transition:opacity .25s ease; pointer-events:none;
  }
  .video-card:hover .video-overlay, .video-card:active .video-overlay{opacity:1;}
  .video-overlay-inner{display:flex; align-items:center; gap:8px; min-width:0;}
  .video-avatar{
    width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:#fff;
  }
  .video-title{
    color:#fff; font-weight:600; font-size:13px; line-height:1.3; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .empty-state{
    grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--muted);
    border:1px dashed var(--glass-border); border-radius:16px;
  }
  .empty-state code{background:var(--glass); padding:2px 6px; border-radius:6px; font-family:'JetBrains Mono',monospace; color:var(--text);}

  .skeleton-card{
    aspect-ratio:16/9; border-radius:var(--radius); background:var(--glass); border:1px solid var(--glass-border);
    position:relative; overflow:hidden;
  }
  .skeleton-shine{
    position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, var(--glass-strong), transparent);
    background-size:200% 100%; animation:shine 1.4s ease-in-out infinite;
  }
  @keyframes shine{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  @media (prefers-reduced-motion: reduce){ .skeleton-shine{animation:none;} }

  /* ---------- Lightbox player ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
    background:rgba(6,6,12,.85); backdrop-filter:blur(6px); padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox-panel{
    width:100%; max-width:920px; background:var(--bg-soft); border:1px solid var(--glass-border);
    border-radius:18px; overflow:hidden; box-shadow:var(--shadow);
  }
  .lightbox-video-wrap{width:100%; aspect-ratio:16/9; background:#000;}
  .lightbox-video-wrap video{width:100%; height:100%; display:block;}
  .lightbox-body{padding:18px 22px 22px; display:flex; flex-direction:column; gap:10px;}
  .lightbox-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .lightbox-title{font-family:'Sora',sans-serif; font-weight:700; font-size:18px; margin:0;}
  .lightbox-close{
    width:34px; height:34px; border-radius:50%; background:var(--glass); border:1px solid var(--glass-border);
    color:var(--text); font-size:16px; flex-shrink:0;
  }
  .lightbox-author{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--muted);}
  .lightbox-caption{font-size:13.5px; color:var(--muted); line-height:1.6; margin:0;}
  .lightbox-actions{display:flex; gap:10px; margin-top:4px;}
  .lb-btn{
    display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:10px; font-size:13px; font-weight:600;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--text); transition:.2s;
  }
  .lb-btn:hover{background:var(--glass-strong);}

  @media (max-width:640px){
    .video-grid{grid-template-columns:1fr 1fr; gap:10px;}
    .video-title{font-size:11.5px;}
    .video-avatar{width:22px;height:22px;font-size:9px;}
    .video-overlay{opacity:1; background:linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 60%);}
    .lightbox{padding:0;}
    .lightbox-panel{border-radius:0; max-width:none; height:100%; display:flex; flex-direction:column;}
    .lightbox-video-wrap{aspect-ratio:auto; flex:0 0 auto; max-height:38vh;}
    .lightbox-body{overflow-y:auto;}
  }
  @media (prefers-reduced-motion: reduce){
    .video-card{animation:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>

<div class="nav-wrap">
  <nav class="pill">
    <div class="brand"><span class="dot"></span> Clip Hub</div>
    <button id="theme-toggle" aria-label="Chuyển giao diện sáng / tối">🌙</button>
  </nav>
</div>

<main class="container">
  <section class="hero">
    <span class="eyebrow">Video ngắn · lưu trong repo</span>
    <h2 class="headline">Kho <span class="accent">video ngắn</span> tự quay</h2>
    <p class="lede">Duyệt video dạng lưới, bấm vào để xem — mọi file được lưu trực tiếp trong repo GitHub.</p>
  </section>

  <div class="toolbar">
    <div class="search-box">
      <span aria-hidden="true">🔍</span>
      <input type="text" id="search-input" placeholder="Tìm video theo tên...">
    </div>
  </div>
  <p class="result-count" id="result-count"></p>

  <div class="video-grid" id="video-grid"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-panel">
    <div class="lightbox-video-wrap">
      <video id="lightbox-video" controls playsinline></video>
    </div>
    <div class="lightbox-body">
      <div class="lightbox-top">
        <h3 class="lightbox-title" id="lightbox-title"></h3>
        <button class="lightbox-close" id="lightbox-close" aria-label="Đóng">✕</button>
      </div>
      <div class="lightbox-author">
        <span class="video-avatar" id="lightbox-avatar" style="width:26px;height:26px;font-size:10.5px;"></span>
        <span id="lightbox-author-name"></span>
        <span>·</span>
        <span id="lightbox-meta"></span>
      </div>
      <p class="lightbox-caption" id="lightbox-caption"></p>
      <div class="lightbox-actions">
        <button class="lb-btn" id="lightbox-share">↗ Sao chép link</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // ---------- Theme: auto-follow device, manual override wins ----------
  const root = document.documentElement;
  const toggleBtn = document.getElementById('theme-toggle');
  const lightQuery = window.matchMedia('(prefers-color-scheme: light)');
  function applyTheme(mode){
    root.setAttribute('data-theme', mode);
    toggleBtn.textContent = mode === 'light' ? '☀️' : '🌙';
  }
  function getManualChoice(){ try { return localStorage.getItem('cliphub-theme'); } catch(e){ return null; } }
  applyTheme(getManualChoice() || (lightQuery.matches ? 'light' : 'dark'));
  lightQuery.addEventListener('change', (e) => { if(!getManualChoice()){ applyTheme(e.matches ? 'light' : 'dark'); } });
  toggleBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('cliphub-theme', next); } catch(e){}
  });

  const navWrap = document.querySelector('.nav-wrap');
  window.addEventListener('scroll', () => { navWrap.classList.toggle('scrolled', window.scrollY > 12); }, { passive:true });

  const palette = ['#7C5CFC','#33E6B3','#FFB86B','#22C1DC','#FF6B6B','#9C6BFF','#5A3FE0'];
  function colorFor(str){
    let hash = 0;
    for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
    return palette[Math.abs(hash) % palette.length];
  }
  function initialsFor(name){
    const words = (name || '?').trim().split(/\s+/).filter(Boolean);
    if(words.length === 1) return words[0].slice(0,2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  const grid = document.getElementById('video-grid');
  const searchInput = document.getElementById('search-input');
  const resultCount = document.getElementById('result-count');
  let allVideos = [];

  function renderGrid(){
    const q = searchInput.value.trim().toLowerCase();
    const filtered = allVideos.filter(v => !q || v.title.toLowerCase().includes(q));

    if(filtered.length === 0){
      grid.innerHTML = allVideos.length
        ? '<div class="empty-state">Không tìm thấy video phù hợp.</div>'
        : `<div class="empty-state">
            Chưa tìm thấy <code>videos.json</code> ở gốc repo.<br><br>
            Đặt file <code>.mp4</code> vào thư mục <code>videos/</code> rồi chạy
            <code>python3 generate_videos_json.py</code> (hoặc để GitHub Action tự chạy).
          </div>`;
      resultCount.textContent = allVideos.length ? '0 video phù hợp' : '';
      return;
    }

    resultCount.textContent = `${filtered.length} video`;

    grid.innerHTML = filtered.map((v, i) => `
      <div class="video-card" style="animation-delay:${Math.min(i,12)*40}ms" data-id="${v.id}">
        <div class="video-thumb">
          ${v.thumbnail
            ? `<img src="${v.thumbnail}" alt="" loading="lazy">`
            : `<div class="video-thumb-fallback">🎬</div>`
          }
          <video class="preview-video" muted loop playsinline webkit-playsinline preload="none" data-src="${v.url}"></video>
          ${v.duration ? `<span class="video-duration">${v.duration}</span>` : ''}
          <div class="video-overlay">
            <div class="video-overlay-inner">
              <div class="video-avatar" style="background:${colorFor(v.author || v.title)}">${initialsFor(v.author)}</div>
              <p class="video-title">${v.title}</p>
            </div>
          </div>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.video-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if(card.dataset.suppressClick === '1'){ card.dataset.suppressClick = '0'; return; }
        openLightbox(card.dataset.id);
      });
      attachPreview(card);
    });
  }

  // ---------- Hover (desktop) / long-press (touch) preview ----------
  const PREVIEW_SECONDS = 4; // chỉ demo vài giây đầu, không phát hết cả video
  function attachPreview(card){
    const video = card.querySelector('.preview-video');
    if(!video) return;
    let hoverTimer = null;
    let longPressTimer = null;
    let previewing = false;

    function startPreview(){
      if(previewing) return;
      previewing = true;
      if(!video.src) video.src = video.dataset.src;
      video.currentTime = 0;
      video.play().catch(() => {});
      video.classList.add('show');
    }
    function stopPreview(){
      if(!previewing) return;
      previewing = false;
      video.pause();
      video.classList.remove('show');
    }
    video.addEventListener('timeupdate', () => {
      if(video.currentTime >= PREVIEW_SECONDS){ video.currentTime = 0; }
    });

    // Desktop hover
    card.addEventListener('mouseenter', () => { hoverTimer = setTimeout(startPreview, 100); });
    card.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); stopPreview(); });

    // Touch: chỉ cần chạm nhẹ là phát preview ngay, không cần giữ lâu
    card.addEventListener('touchstart', () => {
      card.dataset.suppressClick = '0';
      longPressTimer = setTimeout(() => {
        startPreview();
        card.dataset.suppressClick = '1';
      }, 100);
    }, { passive:true });
    card.addEventListener('touchmove', () => { clearTimeout(longPressTimer); });
    card.addEventListener('touchend', () => {
      clearTimeout(longPressTimer);
      if(previewing) stopPreview();
    });
  }

  // ---------- Lightbox ----------
  const lightbox = document.getElementById('lightbox');
  const lbVideo = document.getElementById('lightbox-video');
  const lbTitle = document.getElementById('lightbox-title');
  const lbAvatar = document.getElementById('lightbox-avatar');
  const lbAuthorName = document.getElementById('lightbox-author-name');
  const lbMeta = document.getElementById('lightbox-meta');
  const lbCaption = document.getElementById('lightbox-caption');
  const lbShare = document.getElementById('lightbox-share');
  const lbClose = document.getElementById('lightbox-close');

  function openLightbox(id){
    const v = allVideos.find(x => x.id === id);
    if(!v) return;

    lbVideo.src = v.url;
    if(v.thumbnail) lbVideo.poster = v.thumbnail;
    lbTitle.textContent = v.title;
    lbAvatar.textContent = initialsFor(v.author);
    lbAvatar.style.background = colorFor(v.author || v.title);
    lbAuthorName.textContent = v.author || 'quocchienn';
    lbMeta.textContent = [v.duration, v.size].filter(Boolean).join(' · ');
    lbCaption.textContent = v.caption || '';
    lbCaption.style.display = v.caption ? 'block' : 'none';

    lbShare.onclick = async () => {
      const url = window.location.origin + window.location.pathname + '#' + v.id;
      try {
        await navigator.clipboard.writeText(url);
        lbShare.textContent = '✓ Đã copy';
        setTimeout(() => { lbShare.innerHTML = '↗ Sao chép link'; }, 1500);
      } catch(e){}
    };

    lightbox.classList.add('open');
    lbVideo.play().catch(() => {});
    history.replaceState(null, '', '#' + v.id);
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lbVideo.pause();
    lbVideo.removeAttribute('src');
    lbVideo.load();
    history.replaceState(null, '', window.location.pathname);
  }

  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

  function renderSkeleton(n){
    grid.innerHTML = Array.from({length:n}).map(() => `
      <div class="skeleton-card"><div class="skeleton-shine"></div></div>
    `).join('');
    resultCount.textContent = '';
  }

  async function init(){
    renderSkeleton(6);
    try {
      const res = await fetch('./videos.json', { cache:'no-store' });
      if(res.ok){ allVideos = await res.json(); }
    } catch(e){}
    if(!Array.isArray(allVideos)) allVideos = [];
    renderGrid();

    if(location.hash){
      const id = location.hash.slice(1);
      if(allVideos.some(v => v.id === id)) openLightbox(id);
    }
  }

  searchInput.addEventListener('input', renderGrid);
  init();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reels — Clip ngắn</title>
<meta name="description" content="Kho video ngắn tự quay, lưu trữ ngay trong repo GitHub.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFC'/%3E%3Cstop offset='1' stop-color='%2333E6B3'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%230A0B14'/%3E%3Cpolygon points='38,28 74,50 38,72' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B14; --bg-soft:#10111E;
    --glass:rgba(255,255,255,0.06); --glass-strong:rgba(255,255,255,0.1); --glass-border:rgba(255,255,255,0.12);
    --text:#F1F0F8; --muted:#B7B6C9;
    --accent:#7C5CFC; --mint:#33E6B3;
    --shadow:0 20px 60px -20px rgba(0,0,0,0.7);
  }
  html[data-theme="light"]{
    --bg:#EFEFF6; --bg-soft:#E5E4F1;
    --glass:rgba(20,18,40,0.06); --glass-strong:rgba(20,18,40,0.09); --glass-border:rgba(20,18,40,0.14);
    --text:#191825; --muted:#5C5A72;
    --accent:#6845E0; --mint:#0FA57E;
    --shadow:0 20px 50px -24px rgba(30,20,60,0.3);
  }
  @media (prefers-color-scheme: light){
    html:not([data-theme]){
      --bg:#EFEFF6; --bg-soft:#E5E4F1;
      --glass:rgba(20,18,40,0.06); --glass-strong:rgba(20,18,40,0.09); --glass-border:rgba(20,18,40,0.14);
      --text:#191825; --muted:#5C5A72;
      --accent:#6845E0; --mint:#0FA57E;
      --shadow:0 20px 50px -24px rgba(30,20,60,0.3);
    }
  }
  *{box-sizing:border-box;}
  html{font-size:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  a{color:inherit;}
  ::selection{background:var(--accent); color:#fff;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:60;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px clamp(16px,4vw,28px);
    background:linear-gradient(rgba(0,0,0,.35), transparent);
    pointer-events:none;
  }
  .topbar *{pointer-events:auto;}
  .brand{display:flex; align-items:center; gap:8px; font-family:'Sora',sans-serif; font-weight:700; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.4);}
  .brand .dot{width:9px;height:9px;border-radius:3px; background:linear-gradient(135deg,var(--accent),var(--mint)); box-shadow:0 0 12px var(--accent);}
  .icon-btn{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.12); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.18);
    color:#fff; font-size:16px; transition:.2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.2);}

  /* ---------- Feed ---------- */
  .feed{
    height:100vh; height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory;
    scrollbar-width:none;
  }
  .feed::-webkit-scrollbar{display:none;}
  .reel{
    position:relative; height:100vh; height:100dvh; scroll-snap-align:start;
    display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
    background:var(--bg-soft);
  }
  .reel video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000;
  }
  .reel-scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.15) 45%, transparent 70%);
    pointer-events:none;
  }
  .reel-content{
    position:relative; z-index:2; width:100%; max-width:640px;
    padding:0 84px 28px clamp(16px,4vw,28px);
    color:#fff;
  }
  .reel-author{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:14px; font-weight:600;}
  .reel-avatar{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--mint));
    flex-shrink:0;
  }
  .reel-title{font-family:'Sora',sans-serif; font-weight:700; font-size:17px; line-height:1.35; margin:0 0 6px; text-shadow:0 2px 10px rgba(0,0,0,.4);}
  .reel-caption{font-size:13.5px; color:rgba(255,255,255,.85); line-height:1.5; margin:0;}
  .reel-meta{display:flex; gap:10px; margin-top:10px; font-size:11.5px; color:rgba(255,255,255,.65);}
  .reel-meta span{background:rgba(255,255,255,.12); padding:3px 9px; border-radius:999px; backdrop-filter:blur(6px);}

  /* ---------- Right action rail ---------- */
  .reel-actions{
    position:absolute; right:12px; bottom:100px; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .action-btn{
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,.12); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
    transition:transform .15s ease;
  }
  .action-btn:active{transform:scale(0.88);}
  .action-btn.liked{background:rgba(255,71,133,.25); border-color:rgba(255,71,133,.5); color:#FF4785;}
  .action-count{font-size:11px; color:#fff; margin-top:4px; text-shadow:0 1px 6px rgba(0,0,0,.5); font-weight:600;}

  /* ---------- Progress bar ---------- */
  .reel-progress{
    position:absolute; left:0; right:0; bottom:0; height:3px; z-index:3;
    background:rgba(255,255,255,.2);
  }
  .reel-progress-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--mint)); transition:width .1s linear;}

  .tap-layer{position:absolute; inset:0; z-index:1;}

  .unmute-hint{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:4;
    background:rgba(0,0,0,.5); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; display:flex; align-items:center; gap:6px; opacity:0; transition:opacity .3s; pointer-events:none;
  }
  .unmute-hint.show{opacity:1;}

  /* ---------- Skeleton / loading ---------- */
  .loading-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:var(--bg); color:var(--muted); z-index:100;
  }
  .loading-dot{width:10px;height:10px;border-radius:50%; background:var(--accent); animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3; transform:scale(.8);} 50%{opacity:1; transform:scale(1);}}

  .empty-state{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:32px; color:var(--muted); background:var(--bg); z-index:100;
  }
  .empty-state .box{max-width:420px; font-size:14px; line-height:1.7;}
  .empty-state code{background:var(--glass); padding:2px 6px; border-radius:6px; font-family:'JetBrains Mono',monospace; color:var(--text);}

  @media (prefers-reduced-motion: reduce){
    .loading-dot{animation:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Reels</div>
  <button id="theme-toggle" class="icon-btn" aria-label="Chuyển giao diện sáng / tối">🌙</button>
</div>

<div id="loading-screen" class="loading-screen">
  <div class="loading-dot"></div>
  <div>Đang tải video…</div>
</div>

<div class="feed" id="feed" style="display:none;"></div>

<script>
(function(){
  // ---------- Theme: auto-follow device, manual override wins ----------
  const root = document.documentElement;
  const toggleBtn = document.getElementById('theme-toggle');
  const lightQuery = window.matchMedia('(prefers-color-scheme: light)');

  function applyTheme(mode){
    root.setAttribute('data-theme', mode);
    toggleBtn.textContent = mode === 'light' ? '☀️' : '🌙';
  }
  function getManualChoice(){
    try { return localStorage.getItem('reels-theme'); } catch(e){ return null; }
  }
  applyTheme(getManualChoice() || (lightQuery.matches ? 'light' : 'dark'));
  lightQuery.addEventListener('change', (e) => {
    if(!getManualChoice()){ applyTheme(e.matches ? 'light' : 'dark'); }
  });
  toggleBtn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('reels-theme', next); } catch(e){}
  });

  // ---------- Liked state (local only — no backend, so counts are per-browser) ----------
  function getLikedSet(){
    try { return new Set(JSON.parse(localStorage.getItem('reels-liked') || '[]')); }
    catch(e){ return new Set(); }
  }
  function saveLikedSet(set){
    try { localStorage.setItem('reels-liked', JSON.stringify([...set])); } catch(e){}
  }

  function initialsFor(name){
    const words = (name || '?').trim().split(/\s+/).filter(Boolean);
    if(words.length === 1) return words[0].slice(0,2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  const feed = document.getElementById('feed');
  const loadingScreen = document.getElementById('loading-screen');

  function showEmptyState(){
    loadingScreen.style.display = 'none';
    document.body.insertAdjacentHTML('beforeend', `
      <div class="empty-state">
        <div class="box">
          Chưa tìm thấy <code>videos.json</code> ở gốc repo.<br><br>
          Đặt file <code>.mp4</code> vào thư mục <code>videos/</code> rồi chạy
          <code>python3 generate_videos_json.py</code> (hoặc để GitHub Action tự chạy)
          để sinh file này.
        </div>
      </div>
    `);
  }

  function buildReel(v, index){
    const liked = getLikedSet().has(v.id);
    const wrapper = document.createElement('div');
    wrapper.className = 'reel';
    wrapper.innerHTML = `
      <video src="${v.url}" ${v.thumbnail ? `poster="${v.thumbnail}"` : ''} loop muted playsinline preload="metadata"></video>
      <div class="reel-scrim"></div>
      <div class="tap-layer" data-role="tap"></div>
      <div class="unmute-hint" data-role="hint">🔇 Chạm để bật tiếng</div>
      <div class="reel-progress"><div class="reel-progress-fill" data-role="progress"></div></div>

      <div class="reel-content">
        <div class="reel-author">
          <span class="reel-avatar">${initialsFor(v.author)}</span>
          <span>@${v.author || 'quocchienn'}</span>
        </div>
        <p class="reel-title">${v.title}</p>
        ${v.caption ? `<p class="reel-caption">${v.caption}</p>` : ''}
        <div class="reel-meta">
          ${v.duration ? `<span>${v.duration}</span>` : ''}
          ${v.size ? `<span>${v.size}</span>` : ''}
        </div>
      </div>

      <div class="reel-actions">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="action-btn ${liked ? 'liked' : ''}" data-role="like">❤</button>
          <span class="action-count" data-role="like-count">${v.likes + (liked ? 1 : 0)}</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="action-btn" data-role="mute">🔇</button>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center;">
          <button class="action-btn" data-role="share">↗</button>
        </div>
      </div>
    `;

    const video = wrapper.querySelector('video');
    const tapLayer = wrapper.querySelector('[data-role="tap"]');
    const hint = wrapper.querySelector('[data-role="hint"]');
    const progress = wrapper.querySelector('[data-role="progress"]');
    const likeBtn = wrapper.querySelector('[data-role="like"]');
    const likeCount = wrapper.querySelector('[data-role="like-count"]');
    const muteBtn = wrapper.querySelector('[data-role="mute"]');
    const shareBtn = wrapper.querySelector('[data-role="share"]');

    video.muted = true;
    muteBtn.textContent = '🔇';

    function toggleMute(){
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? '🔇' : '🔊';
      if(!video.muted){
        hint.classList.remove('show');
      }
    }
    tapLayer.addEventListener('click', () => {
      if(video.paused){ video.play().catch(()=>{}); } else { toggleMute(); }
    });
    muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const liked = getLikedSet();
      const isLiked = liked.has(v.id);
      if(isLiked){ liked.delete(v.id); likeBtn.classList.remove('liked'); }
      else { liked.add(v.id); likeBtn.classList.add('liked'); }
      saveLikedSet(liked);
      likeCount.textContent = v.likes + (liked.has(v.id) ? 1 : 0);
    });

    shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const url = window.location.origin + window.location.pathname + '#' + v.id;
      try {
        await navigator.clipboard.writeText(url);
        shareBtn.textContent = '✓';
        setTimeout(() => { shareBtn.textContent = '↗'; }, 1400);
      } catch(err){}
    });

    video.addEventListener('timeupdate', () => {
      if(video.duration){ progress.style.width = (video.currentTime / video.duration * 100) + '%'; }
    });

    wrapper.dataset.videoId = v.id;
    wrapper._video = video;
    wrapper._hint = hint;
    return wrapper;
  }

  async function init(){
    let videos = [];
    try {
      const res = await fetch('./videos.json', { cache:'no-store' });
      if(res.ok){ videos = await res.json(); }
    } catch(e){}

    if(!Array.isArray(videos) || videos.length === 0){
      showEmptyState();
      return;
    }

    videos.forEach((v, i) => feed.appendChild(buildReel(v, i)));
    loadingScreen.style.display = 'none';
    feed.style.display = 'block';

    // Autoplay the video currently in view; pause the rest
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target._video;
        const hint = entry.target._hint;
        if(entry.isIntersecting && entry.intersectionRatio > 0.6){
          video.play().catch(() => {
            // Autoplay with sound blocked by browser — show hint to unmute/tap
            hint.classList.add('show');
          });
        } else {
          video.pause();
        }
      });
    }, { threshold: [0, 0.6, 1] });

    document.querySelectorAll('.reel').forEach(reel => observer.observe(reel));

    // Deep-link to a specific video via #id
    if(location.hash){
      const target = document.querySelector(`.reel[data-video-id="${location.hash.slice(1)}"]`);
      if(target){ target.scrollIntoView(); }
    }
  }

  init();
})();
</script>
</body>
</html>
